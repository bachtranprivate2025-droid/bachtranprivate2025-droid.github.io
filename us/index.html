 '<p><b>RVOL</b> = volume phiên / TB 20 phiên trước đó. RVOL tuần = volume TB/phiên của tuần / TB 10 tuần trước đó; biểu đồ hiện 10 tuần gần nhất. <b>Xếp hạng RVOL ngày + tuần</b>: điểm ngày (0–10) = 70% điểm bền 10 phiên + 30% mức tăng Δ5 phiên (tối đa ở +50%); điểm tuần (0–10) = 70% trung bình của (RVOL tuần cuối, tối đa ở 1,5×) và (số tuần tăng liên tiếp, tối đa ở 3 tuần) + 30% nếu tuần cuối cao hơn tuần trước; điểm chung = 60% khung yếu hơn + 40% trung bình hai khung, nên chỉ mã mạnh cả hai khung mới lên đầu. Giá 1 tuần giảm thì điểm ×0,5 vì volume lớn trên tuần giảm thường là bán ra. Chỉ tham khảo, không vào hạng setup. <b>RS rating</b> = xếp hạng percentile trong 72 mã (Dow 30 + 4 danh mục) của (40% lợi nhuận 3M + 20% 6M + 20% 9M + 20% 12M); mã mới niêm yết dùng các kỳ có sẵn. Insider, short interest, analyst chỉ tham khảo, không vào điểm. Cột 13F đã bỏ vì dữ liệu 12 tháng không phân biệt được mã tốt xấu.</p>'+
