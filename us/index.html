<script>

 '<p><b>Hạng setup TA</b>: 4 trụ, mỗi trụ 0–2. <b>RS</b>: 2 = đường RS (giá/SPY) trên MA20, thắng SPY 10 phiên, 3M ≤ 15% và (RS rating ≥ 80 hoặc RS lập đỉnh 21 phiên); 0 = 3M &gt; 20% hoặc dưới MA20 và thua SPY. <b>RV</b>: giữ như bản VN (nền 7 phiên &lt; 0,8× rồi nổ ≥ 1,5× trong 3 phiên, hoặc tăng dần); 0 = nổ ≥ 2× đúng phiên giảm. <b>CB</b>: 2 = điểm cơ bản ≥ 65 và catalyst tích cực mạnh trong 30 ngày; ±1 theo KQKD so với dự báo. <b>NG</b>: ETF ngành trong Top 4 12M (+1), trên SMA200 (+1/−1), 1M hơn SPY (+1/−1), ETF ngành con 1M hơn SPY (+1/−1); 2 = tổng ≥ +2 và ETF trên SMA200. Có KQKD trong 7 ngày thì hạng tối đa B.</p>'+
 '<p><b>RVOL</b> = volume phiên / TB 20 phiên trước đó. RVOL tuần = volume TB/phiên của tuần / TB 10 tuần trước đó; biểu đồ hiện 10 tuần gần nhất. <b>Xếp hạng RVOL ngày + tuần</b>: điểm ngày (0–10) = 70% điểm bền 10 phiên + 30% mức tăng Δ5 phiên (tối đa ở +50%); điểm tuần (0–10) = 70% trung bình của (RVOL tuần cuối, tối đa ở 1,5×) và (số tuần tăng liên tiếp, tối đa ở 3 tuần) + 30% nếu tuần cuối cao hơn tuần trước; điểm chung = 60% khung yếu hơn + 40% trung bình hai khung, nên chỉ mã mạnh cả hai khung mới lên đầu. Giá 1 tuần giảm thì điểm ×0,5 vì volume lớn trên tuần giảm thường là bán ra. Chỉ tham khảo, không vào hạng setup. <b>RS rating</b> = xếp hạng percentile trong 54 mã cổ phiếu thường của 4 danh mục của (40% lợi nhuận 3M + 20% 6M + 20% 9M + 20% 12M); mã mới niêm yết dùng các kỳ có sẵn. Insider, short interest, analyst chỉ tham khảo, không vào điểm. Cột 13F đã bỏ vì dữ liệu 12 tháng không phân biệt được mã tốt xấu.</p>'+
 '<p><b>Nguồn:</b> Yahoo Finance (lịch sử OHLCV, không điều chỉnh cổ tức); TradingView (watchlist, cơ bản, EPS/doanh thu thực tế và đồng thuận, lịch KQKD, analyst, tiêu đề tin). Insider và short interest là bản lưu 08/11 từ MarketBeat/stockanalysis.com, chưa xác minh lại; bản cũ không ghi ngày chốt kỳ short interest, nên ngày chốt kỳ là N/A. Catalyst là nhận định từ tiêu đề có liên kết, không phải xác nhận đầy đủ nội dung hoặc nhân quả biến động giá.</p><p><b>Chuẩn hóa phép tính trong bản 10/11:</b> do mã nguồn công thức điểm cũ không có trong kho, bản này công bố các ngưỡng để tái lập: DT YoY ≥15/8/3/0% = 20/15/10/5 điểm, âm = 0; EPS YoY ≥25/10/0% = 20/15/8, âm = 0; biên LN ≥25/15/7/2% = 15/12/8/4; FCF ≥20/10/5/0% = 15/10/6/3; Piotroski ≥8/6/0 = 15/10/5; nợ/vốn chủ ≤0,5/1/2/4 = 15/12/8/4, cao hơn hoặc vốn chủ âm = 0. Nhóm tài chính (kể cả thanh toán) đặt Piotroski và nợ trung tính 8. Thiếu thành phần = N/A và không xếp tổng hợp, setup tối đa B. Vì đã chuẩn hóa ngưỡng và đổi nguồn OHLCV, điểm không dùng để so trực tiếp với điểm bản 06/11.</p><p><b>Điểm bền RVOL 0–10</b> = 4×min(TB10/1,5;1) + 4×số phiên ≥1×/10 + 2×[1−min(độ lệch chuẩn/TB10;1)]. Tăng bền để trụ RV=2: Δ5 ≥20%, ≥3/10 phiên có RVOL ≥1,5×, ≥6/10 phiên ≥1× và giá phiên cuối không giảm. Nếu 3M &gt;20% thì RS=RV=0. RS rating dùng duy nhất 54 cổ phiếu thường hiện có, 40/20/20/20% cho 3/6/9/12M; không còn dùng mẫu 72 mã cũ. KQKD tính từ ngày hiện tại 10/11; phản ứng giá dùng phiên sau ngày công bố, giờ công bố chưa xác minh và 5 phiên chưa đủ thì N/A.</p></details>'+
 '<details class="legend" open><summary><b>Chú giải</b> <span class="note">· bấm để thu gọn</span></summary><div class="lgrid">'+
 '<div class="lgcard"><div class="lgh">Hạng setup TA</div><ul><li><b>A+</b>: RS, RV, CB đều 2/2 và NG ≥ 1</li><li><b>A</b>: RS, RV đều 2/2</li><li><b>B</b>: 3 trụ chính ≥ 3/6 và RS ≥ 1 · <b>C</b>: còn lại</li><li><b>⭐</b> NG 2/2 · <b>⏳</b> KQKD trong 7 ngày</li></ul></div>'+
 '<div class="lgcard"><div class="lgh">RVOL</div><ul><li><span class="lgc" style="background:#5a5a5a"></span>&lt; 1× · <span class="lgc" style="background:var(--blue)"></span>1–1,5× · <span class="lgc" style="background:var(--yellow)"></span>1,5–2× · <span class="lgc" style="background:var(--green)"></span>≥ 2×</li><li>Vạch trắng 1×, vạch vàng 1,5×</li><li><b>Xếp hạng D + W</b>: #1 = volume tăng bền cả khung ngày lẫn tuần; giá 1W giảm thì điểm ×0,5</li></ul></div>'+
 '<div class="lgcard"><div class="lgh">Insider · Short</div><ul><li><b>Insider</b>: chỉ <i>mua</i> mới có ý nghĩa; bán thường là thù lao</li><li><b>Short</b>: % float; &gt; 5% là cao với large-cap</li></ul></div>'+
 '<div class="lgcard"><div class="lgh">Ký hiệu</div><ul><li>🟢 tốt · 🟡 chưa đủ · 🔴 xấu · ⚪ trung tính/không đáng kể · ⚠️ cần đọc kỹ</li><li><b>đ.%</b> = chênh lệch điểm phần trăm</li><li><b>PT</b> = giá mục tiêu analyst</li></ul></div></div></details>'+
 '<h2>3. Bảng phân tích '+rows.length+' mã (nhóm theo sector)</h2><div class="toolbar"><label>Tìm mã <input id="search" placeholder="VD: AMGN" autocomplete="off"></label><label>Danh mục <select id="list"><option value="">Tất cả</option><option>Leader 2-2</option><option>RVOL</option><option>Stage 0-1</option><option>Stage 1-2</option></select></label><label>Sắp xếp <select id="sort"><option value="sector" selected>Theo sector (hạng rotation)</option><option value="setupScore">Hạng setup TA</option><option value="rankScore">Ưu tiên tổng hợp</option><option value="f">Điểm cơ bản</option><option value="rs">RS rating</option><option value="rs10">RS vs SPY 10 phiên</option><option value="rvt">RVOL phiên cuối</option><option value="rvs">RVOL điểm bền</option><option value="rvr">Xếp hạng RVOL ngày + tuần</option><option value="rvd">Điểm RVOL ngày</option><option value="rvw">Điểm RVOL tuần</option><option value="eps">EPS vượt dự báo</option><option value="up">Upside giá mục tiêu</option><option value="sf">Short % float</option></select></label><span id="visible" class="note"></span></div>'+
 '<div class="scroll"><table id="master"><thead><tr><th class="sticky-rank">Rank</th><th class="sticky-ticker">Mã</th><th>Hạng setup TA</th><th>KQKD quý</th><th>Catalyst + Cơ bản</th><th>RVOL 20 phiên</th><th>RVOL 10 tuần</th><th title="Điểm = 60% khung yếu hơn + 40% trung bình hai khung">Xếp hạng RVOL ngày + tuần</th><th>RS vs SPY 10 phiên</th><th>Điểm cơ bản</th><th>Analyst</th><th>Insider 12T</th><th>Short interest</th><th>RS rating</th><th>1W / 1M / 3M / 6M / 1Y</th><th>ETF ngành</th><th>Pullback ATR</th><th>Nhận định / Điều kiện</th></tr></thead><tbody></tbody></table></div>'+
 '<h2>4. Kết luận</h2>'+concl()+
 '<div class="footer">Giá chốt 09/11/2026 · kiểm tra 10/11/2026 (Asia/Bangkok) · 55 mã duy nhất: 54 cổ phiếu thường + STRC · 4 watchlist TradingView · 11 ETF ngành + 14 ETF ngành con · Yahoo Finance / TradingView. Dữ liệu cũ và N/A có ngày riêng trên từng cột.</div>';
document.querySelectorAll("table.srtbl").forEach(tb=>{const ths=[...tb.tHead.rows[0].cells];const body=tb.tBodies[0];[...body.rows].forEach((r,i)=>r.dataset.i=i);
 ths.forEach((th,c)=>{th.insertAdjacentHTML("beforeend",'<span class="sar">⇅</span>');th.title="Bấm để sắp xếp";th.addEventListener("click",()=>{const cur=th.dataset.s||"",txt=c===0,st=txt?(cur===""?"a":cur==="a"?"d":""):(cur===""?"d":cur==="d"?"a":"");
  ths.forEach(h=>{h.dataset.s="";h.classList.remove("on");h.querySelector(".sar").textContent="⇅";});th.dataset.s=st;if(st){th.classList.add("on");th.querySelector(".sar").textContent=st==="d"?"↓":"↑";}
  const R=[...body.rows];R.sort((x,y)=>{if(!st)return x.dataset.i-y.dataset.i;const a=x.cells[c].dataset.v??"",b=y.cells[c].dataset.v??"";if(a===""&&b!=="")return 1;if(b===""&&a!=="")return -1;const na=parseFloat(a),nb=parseFloat(b);const r=(isNaN(na)||isNaN(nb))?String(a).localeCompare(String(b)):na-nb;return st==="d"?-r:r;});R.forEach(r=>body.appendChild(r));});});});
const key={rankScore:r=>r.rankScore,setupScore:r=>r.setupScore,f:r=>r.f,rs:r=>r.rs,rs10:r=>r.rs30.r10,rvt:r=>r.rvolStats.today,rvs:r=>r.rvolStats.score,rvr:r=>r.rvRank.score,rvd:r=>r.rvRank.D,rvw:r=>r.rvRank.W,eps:r=>r.earn.epsSurp,up:r=>r.an.up,sf:r=>r.short.pf};
const SORD={};DATA.sectors.forEach((x,i)=>SORD[x.sym]=i);
function render(){const term=document.querySelector("#search").value.trim().toUpperCase(),sv=document.querySelector("#sort").value,lf=document.querySelector("#list").value,k=key[sv];
 let sel=rows.filter(r=>(!term||r.t.includes(term)||r.name.toUpperCase().includes(term))&&(!lf||r.lists.includes(lf)));
 if(sv==="sector"){sel.sort((a,b)=>(SORD[a.etf]-SORD[b.etf])||(b.setupScore-a.setupScore));let h="",cur="";sel.forEach(r=>{if(r.etf!==cur){cur=r.etf;const e=SEC[cur];h+='<tr class="sechead"><td colspan="19"><b>'+cur+' · '+esc(e.name)+'</b> <span class="note">hạng 12M #'+e.rank12+(e.leader?' ⭐ leader':'')+' · '+(e.above200?'🟢 trên':'🔴 dưới')+' SMA200 · 1M − SPY '+sign(e.rel1m,1)+' đ.% · '+sel.filter(x=>x.etf===cur).length+' mã</span></td></tr>';}h+=tr(r);});document.querySelector("#master tbody").innerHTML=h;}
 else{sel.sort((a,b)=>(k(b)??-1e9)-(k(a)??-1e9));document.querySelector("#master tbody").innerHTML=sel.map(tr).join("");}document.querySelector("#visible").textContent=sel.length+"/"+rows.length+" mã";}
document.querySelector("#search").addEventListener("input",render);document.querySelector("#sort").addEventListener("change",render);document.querySelector("#list").addEventListener("change",render);render();
})();
