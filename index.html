ệ thông tin"><b>Công nghệ thông tin</b> <span class="note">9500</span></td><td data-v="1002.1"><span class="ph phG">Tụt hậu</span></td><td data-v="2.1" class="hc ht0">2</td><td data-v="0.0" class="hc ht0">0</td><td data-v="0"><span class="mo mMid">0</span></td><td data-v="-2.26" class="rneg">−2,26%</td><td data-v="-4.86" class="rneg rb">−4,86%</td><td data-v="-5.5" class="rneg rb">−5,50%</td><td data-v="-14.29" class="rneg rb">−14,29%</td><td data-v="-19.47" class="rneg rb">−19,47%</td><td data-v="-1"><span class="ngp ngN">-1</span></td><td class="tks">–</td></tr></tbody></table></div><div class="note">NG (trụ 5) = tổng điểm: rotation cấp 2 (−1/0/+1) + ngành ICB4 FinLens (🟢+1/🟡0/🔴−1) + ETF Mỹ + hàng hóa. NG 2 khi tổng ≥ +2 và ngành cấp 2 không ngược; NG 0 khi tổng ≤ −1 hoặc cả cấp 2 lẫn ICB4 cùng xấu; còn lại NG 1. Dữ liệu Fialda chốt phiên 28/10 (đã đối chiếu lại sau giờ đóng cửa); 1D = 0,00% là ngành đứng yên thật trong phiên. Các cột khác của báo cáo chốt 26–27/10.</div></div><div class="lead">Ưu tiên sector Việt Nam, ETF quốc tế bổ sung bối cảnh. Market regime chưa được cập nhật; allocation là tỷ trọng mục tiêu nghiên cứu có điều kiện.</div>'+
    '<details><summary>Phương pháp điểm, điều kiện allocation và nguồn</summary><p>Điểm xác nhận = 40% điểm cơ bản + 20% catalyst + 30% dòng tiền + 10% sector. Điểm cơ bản = trung bình F FinLens (0–100) và TCBS stockRating ×20 (thang 1–5 quy về 0–100); thiếu một nguồn thì dùng nguồn còn lại. Tiêu chí kỹ thuật (RS mã, Leader, Momentum) đã bỏ khỏi chấm điểm từ 25/10/2026; các cột RS vẫn hiển thị để tham khảo. Mô hình nghiên cứu của báo cáo chưa backtest. Dữ liệu thiếu chưa đóng góp điểm xác nhận; không đồng nghĩa doanh nghiệp yếu.</p>'+
    '<p>Allocation score /100 dùng trọng số: 35% điểm cơ bản (TB F và TCBS×20), 25% catalyst, 25% dòng tiền và 15% confluence cổ phiếu/ngành/VNINDEX; có trừ điểm cap, red flag, dòng tiền âm và tương quan ngành yếu. Core ≥75, Selective 65–74, Tactical 55–64, Watchlist &lt;55 hoặc thiếu dữ liệu. Tỷ trọng 70% cổ phiếu được phân bổ theo score trong nhóm đủ dữ liệu, giới hạn 8%/mã và 25%/sector; 30% là tiền mặt nền. Nếu phần cổ phiếu chưa dùng hết, phần dư ghi Reserve để tổng luôn đúng 100%.</p>'+ 
    '<p>Catalyst phân loại theo tin đã lưu: sự kiện lợi nhuận/đầu tư/tăng vốn rõ ràng = 1; tin khuyến nghị có liên quan = 0,7; tin bối cảnh = 0,45; liên quan gián tiếp = 0,25. Đây là quy tắc lọc, cần đối chiếu CBTT. F = equity_score.total; dấu * chỉ khi caps_applied có giá trị. Cap là giới hạn điểm và không chứng minh đó là nguyên nhân duy nhất làm F=0.</p>'+
    '<p>RS = rs_rating; Breadth hiển thị industry_rs (RS ngành, chưa phải tỷ lệ mã tăng); Leader = rs_vs_industry; Momentum hiển thị sector_rs (RS sector). Mini chart NN/TD từ cũ → mới; ô xám = |net| ≤0,5 tỷ; hover/focus để xem ngày và giá trị. Smart money nguồn còn gồm tổ chức trong nước, vì vậy không bằng riêng NN+TD.</p>'+
    '<p>Nguồn: TradingView watchlists/sector/ETF; FinLens profiles, price history, signals_screen, fundamental_quality_scan, flows_get_stock_flow, news. Proxy thiếu quote được ghi NO QUOTE. TCBS: General Rating 23/10 (stockRating, định giá, tài chính, mô hình kinh doanh, vận hành, rsRating, taScore; thang 1–5). TCBS stockRating ×20 được lấy trung bình với F để ra điểm cơ bản dùng cho xếp hạng và allocation; F FinLens quy về thang 1–5 để đối chiếu, lệch dưới 0.5 là khớp. Quỹ: FinLens fund_stock_ownership, GOM/XẢ theo số quỹ tăng/giảm tỷ trọng; kỳ trước 2026 bị đánh dấu dữ liệu cũ. Nội bộ: TCBS getInsiderDealing 12 tháng, dấu theo khối lượng (+ mua, − bán), bỏ dòng khối lượng 0; ròng trên ±10 tỷ mới tính là mua/bán ròng; GD đơn lẻ trên 500 tỷ được gắn ⚠️. Giá mục tiêu: FinLens research_get_analyst_consensus, chỉ dùng báo cáo có giá mục tiêu trong 30 ngày (25/09–25/10/2026); không có báo cáo nào trong 30 ngày thì để trống; upside = trung vị so với giá 26/10; giá nhỏ hơn 1.000 được coi là lỗi đơn vị và nhân 1.000. SSI FA: SSI Research research_list_fa_rating, bản chấm 26/10/2026, thang 100 (KQKD, hiệu quả, triển vọng ngành); ô trống = SSI không chấm; bản cũ 19/04 được gắn ⚠️. Bốn cột Quỹ, Nội bộ, Giá mục tiêu, SSI FA chỉ để tham khảo, không đổi điểm xếp hạng hay allocation. Smart money = NN + TD; không cộng nhóm tổ chức trong nước của FinLens vì trùng số với TD. Relative RVOL: khối lượng khớp từng phiên (FinLens stocks_get_price_history) chia trung bình khối lượng 20 phiên liền trước, không tính phiên đó; 10 cột từ 16/10 (trái) đến 29/10 (phải); vạch đứt trắng = 1×, vạch chấm vàng = 1,5×; cột xám dưới 1×, xanh 1–1,5×, vàng 1,5–2×, xanh lá từ 2×. Số đi kèm: RVOL phiên cuối, TB10 = trung bình 10 phiên, Δ5 phiên = TB RVOL 5 phiên gần nhất so với 5 phiên trước đó, σ = độ lệch chuẩn RVOL 10 phiên (càng cao càng giật cục), số phiên từ 1,5×. Nhãn: Bùng nổ phiên cuối (≥2×), Thanh khoản tăng dần (≥3 phiên từ 1,5× và Δ5 trên +15%), Đang tăng (Δ5 từ +30%), Hạ nhiệt (Δ5 từ −30%), Cạn thanh khoản (TB10 dưới 0,7×). RVOL chỉ tham khảo, không vào điểm xếp hạng hay allocation. RS vs VN30: đường RS = giá đóng cửa mã chia VN30 (FinLens stocks_get_price_history, 21 phiên gần nhất tới 29/10); mini chart là % vượt/thua VN30 cộng dồn từ 15/10 đến 29/10, chấm xanh = phiên mã tăng hơn VN30, chấm đỏ = kém hơn. Số đi kèm: RS 10 phiên, chênh lệch phiên cuối, số phiên thắng VN30, vị trí đường RS so với MA20 của chính nó. Nhãn: RS đỉnh mới trước giá (đường RS lập đỉnh 21 phiên khi giá chưa lập đỉnh), RS đỉnh mới 21 phiên, RS gãy (dưới MA20 và thua VN30 quá 3% trong 10 phiên). Giá cùng mốc với các cột giá/hiệu suất. RS vs VN30 chỉ tham khảo, chưa vào điểm xếp hạng/allocation nhưng là trụ gác cổng của Hạng setup TA. Hạng setup TA (29/10/2026): 4 trụ, mỗi trụ 0–2 điểm. RS (gác cổng): 2 = đường RS trên MA20, thắng VN30 10 phiên, 3M ≤ 15%, RS rating ≥ 80 hoặc RS lập đỉnh 21 phiên; 0 = 3M > 20% hoặc RS dưới MA20 và thua VN30. Dòng tiền: 2 = NN và TD cùng mua ròng 10 phiên, phiên cuối không bán mạnh; 1 = tổng dương hoặc chưa có tổ chức; 0 = tổng bán ròng. RVOL: 2 = cạn (TB10 < 0,8×) rồi nổ ≥ 1,5× hoặc tăng dần (≥ 3 phiên ≥ 1,5×, Δ5 > +15%, chưa chạy xa, dòng tiền dương); 0 = nổ ≥ 2× khi smart money bán hoặc giá đã chạy xa. Catalyst + Cơ bản: 2 = điểm cơ bản ≥ 65 không cap và catalyst tích cực mạnh trong 30 ngày; 1 = chỉ một trong hai (hoặc cơ bản 50–65 + catalyst mạnh); 0 = còn lại hoặc tin tiêu cực. Hạng: A+ = 8/8, A ≥ 6 và RS = 2, B 4–5 và RS ≥ 1, C còn lại. Nền giá và nến H4 anh tự xác nhận trên chart. Tin Duyên Hà gán cho DHC đã loại khỏi catalyst. SCL: tin Vietstock 18/10 về KQKD quý 3. EVG, DDV, GEL, CTS, SHI: FinLens không có tin 30 ngày, catalyst lấy fallback TCBS (CBTT sàn), điểm tin để trung tính.</p><p>ICB4: market_sector_strength trả Sector RS, breadth_rs (RS trung bình các mã thành viên có dữ liệu), divergence = sector_rs − breadth_rs, số mã và hiệu suất 1M/3M/6M/12M dạng phân số; nhân 100 để hiển thị %. 1D/1W tính từ close ngành và cổ phiếu cùng ngày: 26/10 so 23/10 và 19/10; CP − ngành là chênh lệch điểm phần trăm. Hiệu suất này không phải RS percentile. Ngành so VNINDEX: lấy close ngành và VNINDEX cùng ngày 26/10/2026, so với 23/10 (Daily), 19/10 (W, 5 phiên), 25/09 (M, 21 phiên). Lợi suất = (close chốt / close gốc − 1) ×100; chênh lệch = lợi suất ngành − lợi suất VNINDEX, đơn vị điểm %. Dương xanh = vượt index, âm đỏ = kém index; đây là số tự tính, không phải Sector RS percentile. M 21 phiên tự tính có thể khác r1 (1M) nguồn FinLens do quy ước cửa sổ. Chỉ bổ sung dữ liệu so sánh; tiêu chí allocation giữ nguyên.</p></details>'+

    '<h2>6. Kết luận</h2><div class="lead">Có '+rows.filter(r=>r.eligible).length+' mã đạt toàn bộ bộ lọc trong snapshot. '+rows.filter(r=>r.f===0).length+' mã có F = 0 do FinLens áp cap; điểm cơ bản đã lấy trung bình với TCBS để không loại mã quá sớm, nhưng các mã này vẫn cần đọc BCTC trước khi giải ngân. Đọc điều kiện còn thiếu ở mỗi dòng trước khi nâng tỷ trọng. Proxy bổ sung bối cảnh; cần xét cơ chế doanh thu và chi phí của từng doanh nghiệp.</div>'+
    '<div class="footer">Báo cáo dữ liệu phiên 29/10/2026 · 137 mã: 3 Stage list + VN RVOL + RVOL TEST vni + RVOL 25/10 + mã anh thêm.</div>';
  function render() {
    const term=document.querySelector("#search").value.trim().toUpperCase();
    const list=document.querySelector("#list").value,sort=document.querySelector("#sort").value;
    const selected=rows.filter(r=>(!term||r.t.includes(term))&&(!list||r.lists.includes(list))).sort((a,b)=>(b[sort]??-Infinity)-(a[sort]??-Infinity) || b.rankScore-a.rankScore || a.t.localeCompare(b.t));
    document.querySelector("#master tbody").innerHTML=selected.map(r=>tr(r,rows.indexOf(r))).join("");
    document.querySelector("#visible").textContent=selected.length+"/"+rows.length+" mã";
  }
  document.querySelector("#search").addEventListener("input",render);
  document.querySelector("#list").addEventListener("change",render);
  document.querySelector("#sort").addEventListener("change",()=>{rvArrow();render();});
  const RVS=["rvolToday","rvolAvg10","rvolDelta"],RVL={rvolToday:"↓ phiên cuối",rvolAvg10:"↓ TB10",rvolDelta:"↓ Δ5"};
  function rvArrow(){const v=document.querySelector("#sort").value,a=document.querySelector("#rvolArrow"),b=document.querySelector("#rsArrow");if(a)a.textContent=RVL[v]||(v==="rvolHi15"?"↓ số phiên ≥1,5×":"⇅");if(b)b.textContent=RSL[v]||"⇅";}
  const RSS=["rs30_10","rs30_1","rs30_wins"],RSL={rs30_10:"↓ 10 phiên",rs30_1:"↓ 29/10",rs30_wins:"↓ số phiên thắng"};
  function rsCycle(){const s=document.querySelector("#sort"),i=RSS.indexOf(s.value);s.value=i<0?RSS[0]:(i===RSS.length-1?"rankScore":RSS[i+1]);rvArrow();render();}
  const rsh=document.querySelector("#rsHead");if(rsh){rsh.addEventListener("click",rsCycle);rsh.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();rsCycle();}});}
  function rvCycle(){const s=document.querySelector("#sort"),i=RVS.indexOf(s.value);s.value=i<0?RVS[0]:(i===RVS.length-1?"rankScore":RVS[i+1]);rvArrow();render();}
  const rvh=document.querySelector("#rvolHead");if(rvh){rvh.addEventListener("click",rvCycle);rvh.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();rvCycle();}});}
  window.reportAudit={rows,allocated,reserve,total:allocated+reserve+30,coverage,caps};
}

renderReport(JSON.parse(document.getElementById("report-data").textContent));
</script></body></html>
