<script>
function renderReport(DATA) {
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const num = (v,n=1) => v == null ? "NO DATA" : Number(v).toFixed(n);
  const sign = (v,n=1) => v == null ? "NO DATA" : (v>0?"+":"")+num(v,n);
  const tone = v => v == null ? "flat" : v>0?"up":v<0?"down":"flat";
  const badge = v => '<span class="score '+(v==null?"na":v>=70?"hot":v>=50?"mid":"cold")+'">'+num(v,0)+'</span>';
  const rows = DATA.rows;
  const clamp=(v,lo=0,hi=100)=>Math.max(lo,Math.min(hi,Number.isFinite(v)?v:0));
  const signScore=v=>v==null?50:v>0?100:0;
  for (const r of rows) {
    const positives = [r.foreign,r.prop].filter(v=>v>0.5).length;
    r.flowScore = r.smart==null?null:r.smart>0?(positives===2?100:positives===1?65:45):r.smart<0?(positives?30:0):50;
    r.catScore = r.title ? (r.newsSent==="negative"?0:r.newsSent==="positive"?100*r.directStrength:30) : null;
    const tech = [r.rs,r.leader,r.mom].filter(v=>v!=null);
    r.techScore = tech.length ? tech.reduce((a,b)=>a+b,0)/tech.length : null;
    const primary = r.sectorProxy.find(p=>typeof p[2]==="number");
    r.confluence = primary ? primary[2]>0?100:primary[2]<0?0:50 : null;
    r.rankScore = .35*(r.f??0)+.15*(r.catScore??0)+.25*(r.flowScore??0)+.15*(r.techScore??0)+.10*(r.confluence??0);
    const stockSector=r.icbComparison?.relative, sectorIndex=r.icbBenchmark?.relative;
    const confluenceParts=[stockSector?.d1,stockSector?.w1,sectorIndex?.d1,sectorIndex?.w1,sectorIndex?.m1].filter(v=>typeof v==="number").map(signScore);
    r.confluenceScore=confluenceParts.length?confluenceParts.reduce((a,b)=>a+b,0)/confluenceParts.length:50;
    const rawAllocation=.30*(r.f??0)+.20*(r.catScore??0)+.20*(r.flowScore??0)+.15*(r.techScore??0)+.15*r.confluenceScore;
    let allocationPenalty=0;
    if(r.caps.length)allocationPenalty+=4;
    if(r.flags.length>=2)allocationPenalty+=4; else if(r.flags.length)allocationPenalty+=2;
    if(typeof stockSector?.w1==="number"&&stockSector.w1<0)allocationPenalty+=5;
    if(typeof sectorIndex?.w1==="number"&&sectorIndex.w1<0)allocationPenalty+=5;
    if(r.smart!=null&&r.smart<0)allocationPenalty+=8;
    if(r.f==null||r.rs==null||r.smart==null)allocationPenalty+=10;
    r.allocScore=clamp(rawAllocation-allocationPenalty);
    r.allocTier=r.allocScore>=75?"Core":r.allocScore>=65?"Selective":r.allocScore>=55?"Tactical":"Watchlist";
    r.gaps = [];
    if (r.f==null || r.f<70) r.gaps.push("F dưới 70 / thiếu F");
    if (r.caps.length) r.gaps.push("F có cap");
    if (!r.title || r.newsSent!=="positive" || r.directStrength<.7) r.gaps.push("chưa xác nhận catalyst trực tiếp mạnh");
    if (r.smart==null || r.smart<=0 || positives===0) r.gaps.push("dòng tiền chưa đồng thuận");
    if (r.rs==null || r.rs<70 || r.mom==null || r.mom<50) r.gaps.push("RS/Momentum chưa đạt hoặc thiếu");
    if (r.confluence==null || r.confluence<50) r.gaps.push("sector chưa xác nhận");
    r.eligible = r.allocScore>=45 && r.f!=null && r.rs!=null && r.smart!=null;
    r.alloc = 0;
  }
  rows.sort((a,b)=>b.rankScore-a.rankScore || a.t.localeCompare(b.t));
  let budget=70;
  const sectorBudget={};
  const allocationPool=rows.filter(r=>r.eligible).sort((a,b)=>b.allocScore-a.allocScore||b.rankScore-a.rankScore).slice(0,24);
  let remaining=budget,active=allocationPool.slice();
  while(remaining>0.01&&active.length){
    const weightSum=active.reduce((sum,r)=>sum+Math.max(1,r.allocScore-45),0);
    const next=[];let spent=0;
    for(const r of active){
      const capacity=Math.max(0,Math.min(8-r.alloc,25-(sectorBudget[r.sector]||0)));
      const share=remaining*Math.max(1,r.allocScore-45)/weightSum;
      const give=Math.min(capacity,share);
      if(give>0){r.alloc+=give;sectorBudget[r.sector]=(sectorBudget[r.sector]||0)+give;spent+=give;}
      if(capacity-give>0.01)next.push(r);
    }
    remaining-=spent;
    if(spent<0.01)break;
    active=next;
  }
  for(const r of rows)r.alloc=Math.round(r.alloc*10)/10;
  let roundingExcess=Math.round((rows.reduce((a,r)=>a+r.alloc,0)-budget)*10)/10;
  for(const r of rows.filter(r=>r.alloc>0).sort((a,b)=>a.alloc-b.alloc)){
    if(roundingExcess<=0)break;
    const cut=Math.min(r.alloc,roundingExcess);
    r.alloc=Math.round((r.alloc-cut)*10)/10;
    roundingExcess=Math.round((roundingExcess-cut)*10)/10;
  }
  const allocated=rows.reduce((a,r)=>a+r.alloc,0),reserve=70-allocated;
  const mini=(arr,label)=>'<div class="squares">'+arr.map((v,i)=>({v,i})).reverse().map(({v,i})=>{
    const text=label+' · '+(DATA.meta.flowDates[i]||"CHƯA XÁC NHẬN NGÀY")+' · '+sign(v,2)+' tỷ';
    return '<i tabindex="0" aria-label="'+esc(text)+'" title="'+esc(text)+'" class="'+(v>.5?"buy":v<-.5?"sell":"zero")+'"></i>';
  }).join("")+'</div>';
  const money=(r,key,arr,label)=>'<td class="money">'+mini(r[arr]||[],label)+'<div class="flowline '+tone(r[key])+'">'+sign(r[key],2)+' tỷ</div><div class="note">09/10 → 22/10 · 10 phiên</div></td>';
  const fbadge=r=>{
    const detail='FinLens equity_score.total; BCTC '+r.quality.years.join(", ")+'. '+(r.caps.length?'Caps: '+r.caps.join("; "):"Nguồn không báo cap.");
    return '<span class="fscore '+(r.f==null?"na":r.f>=70?"good":r.f>=50?"mid":"bad")+'" tabindex="0" title="'+esc(detail)+'">'+num(r.f)+(r.caps.length?"*":"")+'</span>'+(r.caps.length?'<div class="note">Có cap</div>':"");
  };
  const refs=(arr,kind)=>arr.map(p=>'<div><a href="https://www.tradingview.com/chart/?symbol='+encodeURIComponent(p[0])+'" target="_blank" rel="noopener"><code>'+esc(p[0])+'</code></a> '+esc(p[1])+' <span class="'+tone(typeof p[2]==="number"?p[2]:null)+'">'+(typeof p[2]==="number"?sign(p[2],2)+"%":"NO QUOTE")+'</span> <span class="note">· '+kind+'</span></div>').join("");
  const cat=r=>r.title?'<div class="cat '+(r.newsSent==="positive"?"p":r.newsSent==="negative"?"n":"u")+'"><b>'+esc(r.title)+'</b></div><div>'+esc(r.summary||"")+'</div><div class="note">'+esc(r.source)+' · '+esc(r.newsDate)+' · '+(r.directStrength>=.7?"Catalyst trực tiếp / cần đối chiếu CBTT":"Tin bối cảnh / cần xác minh tác động")+'</div>':'<div class="note">'+esc(r.excludedCatalyst?.reason||"CHƯA XÁC NHẬN — chưa có catalyst riêng phù hợp trong cửa sổ 30 ngày.")+'</div>';
  const icbDetail=r=>{
    const p=r.icbComparison,s=r.icbStrength;
    const val=(v,unit)=>'<span class="'+tone(v)+'">'+sign(v,2)+(v==null?"":unit)+'</span>';
    const line=(label,obj,unit)=>'<div class="icb-perf-row" role="row"><span role="cell">'+label+'</span><span role="cell">'+val(obj?.d1,unit)+'</span><span role="cell">'+val(obj?.w1,unit)+'</span></div>';
    const compare=p?'<div class="icb-perf" role="table" aria-label="'+r.t+' so với ngành '+esc(r.icb)+'"><div class="icb-perf-row icb-perf-head" role="row"><span role="columnheader">Hiệu suất</span><span role="columnheader">1D</span><span role="columnheader">1W · 5 phiên</span></div>'+line(r.t,p.stock,"%")+line('ICB4 '+esc(r.icb),p.sector,"%")+line('CP − ngành',p.relative,' đ.%')+'</div>':'<div class="note">1D / 1W: CHƯA XÁC NHẬN</div>';
    const strength=s?'<div class="icb-strength"><b>Ngành:</b> Sector RS '+num(s.sector_rs,0)+'/100 · Breadth RS '+num(s.breadth_rs,0)+'/100<br><span class="note">Breadth tính từ '+num(s.breadth_n_stocks,0)+' / '+num(s.n_stocks,0)+' mã · Phân kỳ '+sign(s.divergence,0)+'</span></div><div class="icb-months"><b>Ngành 1M / 3M / 6M / 12M:</b><br>'+[s.r1,s.r3,s.r6,s.r12].map(v=>val(v==null?null:v*100,"%")).join(' / ')+'</div>':'<div class="note">Sector RS / Breadth / 1M–12M: NO DATA — market_sector_strength chưa trả nhóm này.</div>';
    return compare+strength+'<div class="note">FinLens · chốt 23/10/2026<br>1D so 22/10 · 1W so 16/10 · CP − ngành: điểm %</div>';
  };
  const icbVsIndex=r=>{
    const p=r.icbBenchmark;
    if(!p)return '<div class="note">Ngành so với VNINDEX: CHƯA XÁC NHẬN</div>';
